<!DOCTYPE html>
<html>
<head>
  <title>Clicker Alvin Cybers</title>
  <style>
    body {
      background: url('https://i.imgur.com/8zQZQYQ.jpg') no-repeat center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      font-family: Arial;
      padding-top: 50px;
      margin: 0;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: -1;
    }
    h1 {
      font-size: 40px;
      text-shadow: 0 0 20px cyan;
      animation: glow 2s infinite;
    }
    #score {
      font-size: 80px;
      color: lime;
      font-weight: bold;
      margin: 30px;
      text-shadow: 0 0 30px lime;
    }
    button {
      background: linear-gradient(45deg, lime, cyan);
      color: black;
      border: none;
      padding: 40px 80px;
      font-size: 30px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 0 30px lime;
    }
    button:active {
      transform: scale(0.9);
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px cyan; }
      50% { text-shadow: 0 0 40px cyan, 0 0 60px blue; }
    }
  </style>
</head>
<body>
  <h1>🔥 CLICKER ALVIN CYBERS 🔥</h1>
  <div id="score">0</div>
  <button onclick="tambah()">KLIK CEPET!!</button>

  <script>
    let skor = 0;
    function tambah() {
      skor++;
      document.getElementById('score').innerText = skor;
    }
  </script>
</body>
</html>
