<!DOCTYPE html>
<html>
<head>
  <title>Game Alvin Cybers</title>
  <style>
    body {
      background: black;
      color: lime;
      text-align: center;
      font-family: Arial;
      padding-top: 100px;
    }
    h1 {
      animation: kedip 1s infinite;
    }
    button {
      background: lime;
      color: black;
      border: none;
      padding: 20px 40px;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      transform: scale(1.2) rotate(5deg);
      box-shadow: 0 0 20px lime;
    }
    @keyframes kedip {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>🔥 GAME ALVIN CYBERS 🔥</h1>
  <p>Klik tombol di bawah wkwk</p>
  <button onclick="alert('BOOM! Lu kena prank wkwk')">KLIK GUE DONG</button>
</body>
</html>
