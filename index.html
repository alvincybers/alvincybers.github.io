<!DOCTYPE html>
<html>
<head>
  <title>Clicker Alvin Cybers V3</title>
  <style>
    body {
      background: linear-gradient(135deg, #000, #0a0a2a);
      color: white;
      text-align: center;
      font-family: 'Courier New', monospace;
      padding-top: 30px;
      margin: 0;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      z-index: -1;
    }
    /*  ALVIN CYBERS*/
    .marquee {
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      box-sizing: border-box;
      position: fixed;
      top: 10px;
      font-size: 20px;
      color: cyan;
      text-shadow: 0 0 10px cyan;
    }
    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 8s linear infinite;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    
    h1 {
      font-size  <h1>🔥 CLICKER ALVIN CYBERS PRO 🔥</h1>
  <div id="score">0</div>
  <button onclick="tambah(event)">TAP SINI!!</button>

  <script>
    let skor = 0;
    function tambah(e) {
      skor++;
      document.getElementById('score').innerText = skor;

      // Efek +1 melayang pas klik
      let effect = document.createElement('div');
      effect.className = 'click-effect';
      effect.innerText = '+1';
      effect.style.left = e.clientX + 'px';
      effect.style.top = e.clientY + 'px';
      document.body.appendChild(effect);
      setTimeout(() => effect.remove(), 1000);
    }

    // Partikel Matrix jatuh
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノ";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 35);
  </script>
</body>
</html>
